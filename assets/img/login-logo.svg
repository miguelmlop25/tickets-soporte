<?xml version="1.0" encoding="UTF-8"?>
<!-- Imagen de ejemplo (placeholder) para la cabecera del login.
     Reemplazable por el logotipo real de Soluciones Tenería.
     Formato SVG: escalable y ligero. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Logotipo Soluciones Teneria">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563a8"/>
      <stop offset="1" stop-color="#17457e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="120" rx="16" fill="url(#g)"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
  <circle cx="60" cy="60" r="8" fill="#38bdf8"/>
  <text x="110" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Soluciones</text>
  <text x="110" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#38bdf8">Teneria</text>
</svg>