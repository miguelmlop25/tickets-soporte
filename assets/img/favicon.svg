<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon de ejemplo (placeholder) del sistema de tickets de soporte.
     Reemplazable por el favicon real. Formato SVG: escalable y ligero. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Icono del sistema de tickets">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563a8"/>
      <stop offset="1" stop-color="#17457e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#fg)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <circle cx="32" cy="32" r="5" fill="#38bdf8"/>
</svg>